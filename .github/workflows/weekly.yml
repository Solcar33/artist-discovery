name: Découvertes hebdomadaires

on:
  schedule:
    - cron: "17 6 * * 1"   # chaque lundi à 06:17 UTC
  workflow_dispatch:        # permet aussi un lancement manuel

permissions:
  contents: write

jobs:
  decouvertes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Générer les découvertes de la semaine
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          SPOTIFY_PROFILE_B64: ${{ secrets.SPOTIFY_PROFILE_B64 }}
        run: python src/fiche.py

      - name: Construire le site
        run: python src/build_site.py

      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content docs
          git diff --cached --quiet || git commit -m "chore: découvertes de la semaine"
          git push